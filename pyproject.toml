[project]
name = "nonebot-plugin-auth-link"
version = "0.1.0"
description = "QQ 官方 Bot「AI 群服务授权」链接生成插件：卡片按钮预填口令，输入框补全群号，卡片外无效、不会超时"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zlqd123" }]
keywords = ["nonebot", "nonebot2", "qq-bot", "qq-official", "auth"]
dependencies = ["nonebot2>=2.3.0", "nonebot-adapter-qq>=1.7.0"]

[project.urls]
homepage = "https://github.com/zlqd123/nonebot-plugin-auth-link"
repository = "https://github.com/zlqd123/nonebot-plugin-auth-link"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_auth_link"]
